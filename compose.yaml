services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8080}:8080"
    environment:
      APP_CURRENCY: "${APP_CURRENCY:-EUR}"
      APP_CURRENCY_SYMBOL: "${APP_CURRENCY_SYMBOL:-€}"
      APP_TIMEZONE: "${APP_TIMEZONE:-Europe/Athens}"
      OCR_LANGUAGES: "${OCR_LANGUAGES:-ell+eng}"
      OCR_TIMEOUT_SECONDS: "${OCR_TIMEOUT_SECONDS:-25}"
      COOKIE_SECURE: "${COOKIE_SECURE:-auto}"
      TRUSTED_PROXY: "${TRUSTED_PROXY:-}"
      MASTER_KEY: "${MASTER_KEY:-}"
      MASTER_KEY_FILE: "${MASTER_KEY_FILE:-}"
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-localhost}"
      WEBAUTHN_RP_ORIGIN: "${WEBAUTHN_RP_ORIGIN:-http://localhost:8080}"
      REGISTRATION_MODE: "${REGISTRATION_MODE:-invite_only}"
      MAX_HOUSEHOLD_RECEIPTS_MB: "${MAX_HOUSEHOLD_RECEIPTS_MB:-250}"
    volumes:
      - ledger_data:/data
    healthcheck:
      test: ["CMD", "/usr/local/bin/ledger", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ledger_data:
