{{define "content"}}
<div class="auth-wrap">
  <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1rem;">
    <svg width="26" height="26" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect x="4" y="3" width="24" height="26" rx="3" fill="#215440"/>
      <rect x="8" y="6" width="17" height="20" rx="1.5" fill="#FFFDFA"/>
      <line x1="11" y1="11" x2="22" y2="11" stroke="#202820" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="11" y1="15.5" x2="22" y2="15.5" stroke="#D8D5CB" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="11" y1="20" x2="18" y2="20" stroke="#D8D5CB" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
    <span style="font-size: 1.25rem; font-weight: 700; letter-spacing: -0.015em;">Teftéri</span>
  </div>
  <div class="page-head">
    <h1>Sign in</h1>
  </div>

  {{if not .HasUser}}
  <div class="panel panel-warn" role="alert">
    <strong>Account setup required.</strong> Run the one-time setup command to create your household account:
    <pre><code>docker compose run --rm app setup-account</code></pre>
  </div>
  {{end}}

  {{if .Error}}
  <div class="panel panel-danger" role="alert">{{.Error}}</div>
  {{end}}

  <form class="panel form-stack" method="POST" action="/login">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required value="{{.Username}}">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary">Sign in</button>
    <button id="passkey-login-btn" type="button" class="btn btn-secondary" data-csrf="{{.CSRFToken}}">Sign in with passkey</button>
    <div id="passkey-login-status" class="muted" role="status" aria-live="polite"></div>
  </form>

  <p style="margin-top: 1rem;">
    <a href="/recovery">Lost your device? Use a recovery code</a>
  </p>
</div>
{{end}}
