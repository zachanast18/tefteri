{{define "content"}}
<div class="auth-wrap">
  <div class="page-head">
    <h1>Two-factor verification</h1>
  </div>

  {{if .Error}}
  <div class="panel panel-danger" role="alert">{{.Error}}</div>
  {{end}}

  <form class="panel form-stack" method="POST" action="/mfa">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <div class="field">
      <label for="totp-code">Authenticator code (6 digits)</label>
      <input id="totp-code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="123456">
    </div>
    <button type="submit" class="btn btn-primary">Verify</button>
  </form>

  <p style="margin-top: 1rem;">
    <a href="/recovery">Lost your device? Use a recovery code</a>
  </p>
</div>
{{end}}
