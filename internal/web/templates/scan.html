{{define "content"}}
<div class="page-head">
  <div>
    <h1>Scan receipt</h1>
    {{if gt (len .Households) 1}}
    <div class="muted" style="font-size: 0.875rem;">Household: <strong>{{.FormHouseholdName}}</strong></div>
    {{end}}
  </div>
  <a class="btn btn-secondary btn-sm" href="/expenses/new">Enter manually</a>
</div>

{{if .Error}}
<div class="panel panel-danger" role="alert">
  <p style="margin: 0 0 0.5rem;">{{.Error}}</p>
  <div class="action-row">
    <a class="btn btn-secondary btn-sm" href="/scan">Try again</a>
    <a class="btn btn-secondary btn-sm" href="/expenses/new">Enter manually</a>
  </div>
</div>
{{end}}

<form id="scan-form" class="panel form-stack" method="POST" action="/scan" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
  <input type="hidden" name="household_id" value="{{.FormHouseholdID}}">

  <div class="field">
    <label for="receipt-file-input">Receipt photo (JPEG or PNG)</label>
    <input id="receipt-file-input" name="receipt" type="file" accept="image/jpeg,image/png,image/*" capture="environment" required>
    <span class="field-hint">Maximum {{.MaxUploadMB}} MB. Processed locally with Tesseract ({{.OCRLanguages}}).</span>
  </div>

  <div id="scan-preview-wrap" hidden>
    <img id="scan-preview-img" alt="Selected receipt preview" style="max-width: 100%; max-height: 360px; border: 1px solid var(--rule); border-radius: 4px;">
  </div>

  <div id="scan-status" class="muted" role="status" aria-live="polite"></div>

  <div class="action-row">
    <button id="scan-submit-btn" type="submit" class="btn btn-primary">Scan receipt</button>
    <a class="btn btn-secondary" href="/expenses/new">Add without receipt</a>
  </div>
</form>
{{end}}
